# EdgeCloudX — Dashboard (Django Channels / Daphne)
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: edgecloudx
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: edgecloudx
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
  selector:
    app.kubernetes.io/name: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: edgecloudx
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: edgecloudx
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: edgecloudx
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: dashboard
          image: edgex-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: edgecloudx-config
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
