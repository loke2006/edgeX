# EdgeCloudX — Kafka Topic Initializer (runs once)
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: edgecloudx
  labels:
    app.kubernetes.io/name: kafka-init
    app.kubernetes.io/part-of: edgecloudx
    app.kubernetes.io/component: messaging
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
        app.kubernetes.io/part-of: edgecloudx
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until nc -z kafka 9092; do
                echo "Kafka not ready, waiting 5s..."
                sleep 5
              done
              echo "Kafka is ready!"
      containers:
        - name: kafka-init
          image: apache/kafka:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "=== Creating Kafka Topics ==="
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic traffic-density --partitions 3 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic ev-telemetry --partitions 3 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic emergency-alerts --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic anomaly-events --partitions 3 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic node-health --partitions 1 --replication-factor 1
              echo "=== Creating DLQ Topics ==="
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic traffic-density-dlq --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic ev-telemetry-dlq --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic emergency-alerts-dlq --partitions 1 --replication-factor 1
              echo "=== All Topics ==="
              /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092
              echo "=== Done ==="
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
