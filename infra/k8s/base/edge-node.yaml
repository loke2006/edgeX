# EdgeCloudX — Edge Node (Kafka producer, no Service needed)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-node
  namespace: edgecloudx
  labels:
    app.kubernetes.io/name: edge-node
    app.kubernetes.io/part-of: edgecloudx
    app.kubernetes.io/component: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-node
        app.kubernetes.io/part-of: edgecloudx
        app.kubernetes.io/component: edge
    spec:
      containers:
        - name: edge-node
          image: edgex-edge-node:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: edgecloudx-config
          env:
            - name: EDGE_NODE_ID
              value: "edge-node-k8s-01"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
