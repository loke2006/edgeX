[project]
name = "edgecloudx"
version = "0.1.0"
description = "EdgeCloudX — Autonomous Smart City Traffic & Navigation Grid"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
    "services/traffic-service",
    "services/routing-service",
    "services/analytics-service",
    "services/alert-service",
    "services/auth-service",
    "services/edge-node",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require Docker)",
    "slow: Slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
