# ============================================================================
# EdgeCloudX — Docker Compose (Full Stack v2)
# ============================================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d kafka redis  # Start infra only
#   docker compose logs -f            # Follow logs
#   docker compose down -v            # Tear down with volumes
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Apache Kafka (KRaft Mode — No ZooKeeper)
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: edgecloudx-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (built-in for apache/kafka)
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Topics
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      # Performance
      - KAFKA_LOG_RETENTION_HOURS=24
      - KAFKA_MESSAGE_MAX_BYTES=10485760
      # Cluster ID (required for KRaft)
      - CLUSTER_ID=edgecloudx-kafka-cluster-01
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - edgecloudx-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka Topic Initializer (runs once, creates required topics + DLQ topics)
  # --------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:latest
    container_name: edgecloudx-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo '=== Creating Kafka Topics ==='
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic traffic-density --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic ev-telemetry --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic emergency-alerts --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic anomaly-events --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic node-health --partitions 1 --replication-factor 1
      echo '=== Creating DLQ Topics ==='
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic traffic-density-dlq --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic ev-telemetry-dlq --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic emergency-alerts-dlq --partitions 1 --replication-factor 1
      echo '=== Topics Created ==='
      /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092
      "
    networks:
      - edgecloudx-net

  # --------------------------------------------------------------------------
  # Redis 7 (State Layer + Pub/Sub)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: edgecloudx-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - edgecloudx-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # PostgreSQL 16 (Persistent Storage)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: edgecloudx-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgecloudx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgecloudx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-edgecloudx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edgecloudx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgecloudx}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Traffic Service (FastAPI)
  # --------------------------------------------------------------------------
  traffic-service:
    build:
      context: .
      dockerfile: services/traffic-service/Dockerfile
    container_name: edgecloudx-traffic
    ports:
      - "${TRAFFIC_SERVICE_PORT:-8001}:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SERVICE_NAME=traffic-service
      - AUTH_SERVICE_URL=http://auth-service:8000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Routing Service (FastAPI)
  # --------------------------------------------------------------------------
  routing-service:
    build:
      context: .
      dockerfile: services/routing-service/Dockerfile
    container_name: edgecloudx-routing
    ports:
      - "${ROUTING_SERVICE_PORT:-8002}:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SERVICE_NAME=routing-service
      - AUTH_SERVICE_URL=http://auth-service:8000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Analytics Service (FastAPI)
  # --------------------------------------------------------------------------
  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: edgecloudx-analytics
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8003}:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SERVICE_NAME=analytics-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Alert Service (FastAPI)
  # --------------------------------------------------------------------------
  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    container_name: edgecloudx-alert
    ports:
      - "${ALERT_SERVICE_PORT:-8004}:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SERVICE_NAME=alert-service
      - AUTH_SERVICE_URL=http://auth-service:8000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Auth Service (FastAPI)
  # --------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: edgecloudx-auth
    ports:
      - "${AUTH_SERVICE_PORT:-8005}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-60}
      - SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Edge AI Node (Simulation)
  # --------------------------------------------------------------------------
  edge-node:
    build:
      context: .
      dockerfile: services/edge-node/Dockerfile
    container_name: edgecloudx-edge-node
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EDGE_NODE_ID=edge-node-01
      - INTERSECTION_COUNT=16
      - GRID_ROWS=4
      - GRID_COLS=4
      - VEHICLE_DENSITY=medium
      - EVENT_INTERVAL_MS=2000
      - ENABLE_YOLO=false
      - EV_COUNT=4
      - EMERGENCY_PROBABILITY=0.02
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Compute Workers (Ray — Phase 3)
  # --------------------------------------------------------------------------
  compute-workers:
    build:
      context: .
      dockerfile: services/compute-workers/Dockerfile
    container_name: edgecloudx-compute
    ports:
      - "${COMPUTE_WORKERS_PORT:-8006}:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
      - RAY_NUM_CPUS=2
      - SERVICE_NAME=compute-workers
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Real-Time Dashboard (Django Channels — Phase 4)
  # --------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: edgecloudx-dashboard
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TRAFFIC_SERVICE_URL=http://traffic-service:8000
      - ROUTING_SERVICE_URL=http://routing-service:8000
      - ANALYTICS_SERVICE_URL=http://analytics-service:8000
      - ALERT_SERVICE_URL=http://alert-service:8000
      - AUTH_SERVICE_URL=http://auth-service:8000
      - DJANGO_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-dashboard}
    depends_on:
      redis:
        condition: service_healthy
      traffic-service:
        condition: service_started
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Prometheus (Metrics Collection)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: edgecloudx-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Grafana (Dashboards & Visualization)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: edgecloudx-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Loki (Log Aggregation)
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: edgecloudx-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Jaeger (Distributed Tracing)
  # --------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: edgecloudx-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - edgecloudx-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Spark Analytics (Structured Streaming — Phase D)
  # --------------------------------------------------------------------------
  spark-analytics:
    build:
      context: .
      dockerfile: services/spark-analytics/Dockerfile
    container_name: edgecloudx-spark
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
      - JDBC_URL=jdbc:postgresql://postgres:5432/edgecloudx
      - POSTGRES_USER=${POSTGRES_USER:-edgecloudx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edgecloudx_secret}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - edgecloudx-net
    restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
volumes:
  kafka_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  edgecloudx-net:
    driver: bridge
    name: edgecloudx-net
